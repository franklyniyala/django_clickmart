sonar.projectKey=clickmart
sonar.projectName=ClickMart

# Source code
sonar.sources=backend-drf,frontend/src

# Test code
sonar.tests=backend-drf,frontend/src

# Test file identification
sonar.test.inclusions=backend-drf/**/tests.py,backend-drf/**/test_*.py,backend-drf/**/*_test.py,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/**/*.spec.js,frontend/src/**/*.spec.jsx

# Files/directories excluded from analysis
sonar.exclusions=\
**/venv/**,\
**/.venv/**,\
**/__pycache__/**,\
**/migrations/**,\
**/node_modules/**,\
**/static/**,\
**/staticfiles/**,\
**/media/**,\
**/coverage/**,\
**/dist/**,\
**/build/**,\
**/.git/**,\
**/.ruff_cache/**,\
**/*.pyc

# Backend Python coverage
sonar.python.coverage.reportPaths=backend-drf/coverage.xml

# Frontend JavaScript/React coverage
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
