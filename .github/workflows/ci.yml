name: Continuous Integration
on:
  push:
    branches:
      - franklyn

  pull_request:
    branches:
      - main
permissions:
  contents: read 

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:

    runs-on: self-hosted
    
    defaults:
      run:
        working-directory: backend-drf

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: | 
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-drf/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: flake8 .

      - name: Create CI environment
        run: cp .env.ci .env

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres
            do
              echo "Waiting for Postgres..."
              sleep 2
            done

      - name: Run Migrations
        run: |
          python manage.py migrate

      - name: Django system check
        run: python manage.py check

      - name: Run Tests
        run: python manage.py test

      - name: Build Docker Image
        run: docker build -t clickmart-backend .

      - name: Scan Backend Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: clickmart-backend
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

          
  frontend-ci:
    
    runs-on: self-hosted

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Packages
        run: npm ci

      - name: Build Frontend 
        run: npm run build

      - name: Build Docker Image
        run: docker build -t clickmart-frontend .

      - name: Scan Frontend Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: clickmart-frontend
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  sonar-analysis:
    name: SonarQube Aanalysis
    needs: 
      - frontend-ci
      - backend-ci
    runs-on: self-hosted

    steps:
      - name: Check Repository
        uses: actions/checkout@v4

      - name: Sonarqube Scan
        uses: SonarSource/sonarqube-scan-action@v5

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

