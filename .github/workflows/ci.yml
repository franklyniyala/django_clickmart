name: Clickmart CI (Pull Request Checks)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # BACKEND CI
  # ==========================================
  backend-ci:
    name: Backend CI
    runs-on: self-hosted

    defaults:
      run:
        working-directory: backend-drf

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install coverage flake8

      - name: Run Flake8
        run: flake8 .

      - name: Create CI Environment
        run: cp .env.ci .env

      - name: Run Migrations
        run: python manage.py migrate

      - name: Django System Check
        run: python manage.py check

      - name: Run Backend Tests with Coverage
        run: |
          coverage run manage.py test
          coverage xml
          coverage report -m


  # ==========================================
  # FRONTEND CI
  # ==========================================
  frontend-ci:
    name: Frontend CI
    runs-on: self-hosted

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        run: |
          node --version
          npm --version
        

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests with Coverage
        run: npm run test -- --coverage

      - name: Build Frontend
        run: npm run build


  # ==========================================
  # SONARQUBE ANALYSIS
  # ==========================================
  sonar-analysis:
    name: SonarQube Analysis

    needs:
      - frontend-ci
      - backend-ci

    runs-on: self-hosted

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        working-directory: backend-drf
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install coverage

      - name: Create CI Environment
        working-directory: backend-drf
        run: cp .env.ci .env

      - name: Generate Backend Coverage Report
        working-directory: backend-drf
        run: |
          coverage run manage.py test
          coverage xml
          coverage report -m

      - name: Set up Node.js
        run: |
          node --version
          npm --version
          
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Generate Frontend Coverage Report
        working-directory: frontend
        run: npm run test -- --coverage

      - name: Verify Coverage Reports
        run: |
          echo "Checking backend coverage report..."
          ls -lh backend-drf/coverage.xml

          echo "Checking frontend coverage report..."
          ls -lh frontend/coverage/lcov.info

      - name: Verify SonarQube Connectivity
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "Checking SonarQube..."
          curl -f "$SONAR_HOST_URL/api/system/status"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      