name: Continuous Integration
on:
  push:
    branches:
      - franklyn

  pull_request:
    branches:
      - main
permissions:
  contents: read 

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:

    runs-on: ubuntu-latest

    services:
        postgres:
          image: postgres:15

          env:
            POSTGRES_DB: test_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
          ports:
            - 5432:5432

          options: >-
            --health-cmd="pg_isready -U postgres"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=5

    defaults:
      run:
        working-directory: backend-drf

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: | 
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-drf/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create CI environment
        run: cp .env.ci .env

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres
            do
              echo "Waiting for Postgres..."
              sleep 2
            done

      - name: Run Migrations
        run: |
          python manage.py migrate

      - name: Django system check
        run: python manage.py check

      - name: Run Tests
        run: python manage.py test

      - name: Build Docker Image
        run: docker build -t clickmart-backend .
   
  frontend-ci:
    
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Packages
        run: npm ci

      - name: Build Frontend 
        run: npm run build

      - name: Build Docker Image
        run: docker build -t clickmart-frontend .
