name: Continuous Deployment
on:
  push:
    branches: 
      - main

permissions:
  contents: read

jobs:

    docker:
        runs-on: self-hosted

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 1
            
            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Tag Backend Docker Image
              run: |
                docker tag clickmart-backend:latest ${{ secrets.DOCKER_USERNAME }}/clickmart-backend:latest

            - name: Tag Frontend Docker Image
              run: |
                docker tag clickmart-frontend:latest ${{ secrets.DOCKER_USERNAME }}/clickmart-frontend:latest

            - name: Push Backend Docker Image
              run: |
                docker push ${{ secrets.DOCKER_USERNAME }}/clickmart-backend:latest

            - name: Push Frontend Docker Image
              run: |
                docker push ${{ secrets.DOCKER_USERNAME }}/clickmart-frontend:latest


                



         